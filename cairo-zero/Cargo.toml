[package]
name = "cairo-zero"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0.12"
sonic-rs = "0.5.1"
serde_json = "1.0"

cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "92232543984e20e984c5a7194561ff1fffa76dae" }
cairo-vm = { git = "https://github.com/lambdaclass/cairo-vm", rev = "e2c6c91c73cd0bc351721f302390fcc0965c6224", features = [
  "mod_builtin",
] }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "92232543984e20e984c5a7194561ff1fffa76dae" }
stwo_cairo_prover = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "92232543984e20e984c5a7194561ff1fffa76dae" }

utils = { path = "../utils" }
dotenv = "0.15.0"
regex = "1.11.2"
